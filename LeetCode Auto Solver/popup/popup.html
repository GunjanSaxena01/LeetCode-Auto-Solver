<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode Gemini Solver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="logo-area">
        <svg class="gemini-sparkle" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 3c.132 0 .263.051.365.152l8.483 8.483a.516.516 0 0 1 0 .73l-8.483 8.483a.515.515 0 0 1-.73 0l-8.483-8.483a.516.516 0 0 1 0-.73l8.483-8.483A.515.515 0 0 1 12 3z" fill="url(#sparkle-grad)" />
          <defs>
            <linearGradient id="sparkle-grad" x1="12" y1="3" x2="12" y2="21" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#93c5fd" />
              <stop offset="50%" stop-color="#a78bfa" />
              <stop offset="100%" stop-color="#c084fc" />
            </linearGradient>
          </defs>
        </svg>
        <h1>Gemini Solver</h1>
      </div>
      <p class="subtitle">LeetCode Auto Solver (MV3)</p>
    </div>

    <div class="card-body">
      <!-- API Key Row -->
      <div class="input-group">
        <div class="label-row">
          <label for="api-key">Gemini API Key</label>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="help-link">Get Key</a>
        </div>
        <div class="password-wrapper">
          <input type="password" id="api-key" placeholder="Enter your Gemini API key" />
          <button type="button" id="toggle-key" class="icon-btn" title="Toggle visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Config Selection -->
      <div class="flex-row">
        <div class="input-group flex-1">
          <label for="model-select">Gemini Model</label>
          <select id="model-select">
            <option value="gemini-3.5-flash">3.5 Flash (Default)</option>
            <option value="gemini-3.5-pro">3.5 Pro</option>
            <option value="gemini-2.5-flash">2.5 Flash</option>
            <option value="gemini-2.5-pro">2.5 Pro</option>
            <option value="gemini-2.0-flash">2.0 Flash</option>
            <option value="gemini-1.5-flash">1.5 Flash</option>
            <option value="gemini-1.5-pro">1.5 Pro</option>
          </select>
        </div>

        <div class="input-group flex-1">
          <label for="lang-select">Language</label>
          <select id="lang-select">
            <option value="auto">Auto-Detect</option>
            <option value="python">Python</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
            <option value="c">C</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="golang">Go</option>
            <option value="rust">Rust</option>
            <option value="csharp">C#</option>
            <option value="ruby">Ruby</option>
            <option value="swift">Swift</option>
            <option value="kotlin">Kotlin</option>
            <option value="scala">Scala</option>
            <option value="php">PHP</option>
            <option value="erlang">Erlang</option>
            <option value="elixir">Elixir</option>
            <option value="dart">Dart</option>
            <option value="sql">SQL</option>
          </select>
        </div>
      </div>

      <!-- Auto-Submit Toggle -->
      <div class="toggle-group">
        <span class="toggle-label">
          <strong>Auto-Submit Solution</strong>
          <span class="toggle-desc">Submit automatically after injection</span>
        </span>
        <label class="switch">
          <input type="checkbox" id="auto-submit" />
          <span class="slider round"></span>
        </label>
      </div>

      <!-- Action Button -->
      <button type="button" id="solve-btn" class="primary-btn">
        <span class="btn-text">Solve with Gemini</span>
        <span class="btn-loader hidden"></span>
      </button>

      <!-- Terminal logs -->
      <div class="console-wrapper">
        <div class="console-header">
          <span>Execution Log</span>
          <button type="button" id="clear-logs" class="text-btn">Clear</button>
        </div>
        <div id="log-terminal" class="console-body">
          <div class="log-line system">Ready to solve. Open a LeetCode problem tab and click Solve.</div>
        </div>
      </div>
    </div>
    
    <div class="card-footer">
      <span>Shortcut: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
